# armyoftworecomp - hardware / rendering settings
#
# Loaded automatically at startup (see OnConfigurePaths in
# src/armyoftworecomp_app.h) and rewritten by the in-game Settings
# overlay's "Save to config" button. --flag on the command line and REX_*
# environment variables always override values from this file - see
# ../settings/README.md.
#
# Flat key = value only

gpu_plugin = "xenos"

# "any" (d3d12 - win default, vulkan - lin default)
# "d3d12" / "vulkan"
graphics_backend = "any"
vsync = false
# 1 = native 720p. At 2 the UE3 bloom / light shafts blow out (blinding light).
resolution_scale = 1
async_shader_compilation = true
native_2x_msaa = false
anisotropic_override = 3

texture_cache_memory_limit_soft = 1024
texture_cache_memory_limit_hard = 4096
clear_memory_page_state = true
readback_memexport = true
readback_memexport_fast = true
# UE3 reads resolved render targets on the CPU (HDR eye adaptation). Without
# readback the exposure never settles and the image is washed out / overbright.
# Same fix as xenia-manager's optimized settings for 454107F8 ("Fixes the
# bright bloom"); xenia game-compatibility #167 is tagged gpu-readback.
# none | fast (previous frame, no stalls) | some | full (sync, stalls)
readback_resolve = "fast"
host_present_from_non_ui_thread	= true

window_width = 1920
window_height = 1080
fullscreen = true
monitor = 0
resolution = "1920x1080"

# "rov" emulates eDRAM blending and the 7e3 HDR / gamma render-target formats
# exactly; "rtv" is faster but approximates them.
render_target_path_d3d12 = "rov"
gamma_render_target_as_unorm16 = true
store_shaders = true
present_letterbox = true
  
d3d12_adapter = -1
d3d12_allow_variable_refresh_rate_and_tearing = true
d3d12_bindless = true
d3d12_break_on_error = false
d3d12_break_on_warning = false
d3d12_debug = false
d3d12_dxbc_disasm = false
d3d12_dxbc_disasm_dxilconv = false
d3d12_pipeline_creation_threads = -1
d3d12_queue_priority = 2
d3d12_submit_on_primary_buffer_end = true
d3d12_tessellation_wireframe = false

render_target_path_vulkan = "fbo"
vulkan_log_debug_messages = false
vulkan_allow_present_mode_immediate = true
vulkan_allow_present_mode_fifo_relaxed = false
vulkan_allow_present_mode_mailbox = false

headless = false

# trace, debug, info, warn, error
log_level = "critical"

gpu_allow_invalid_fetch_constants = true

# Perf CSV log path (per-frame metrics). Empty = disabled.
# Only works when REXGLUE_ENABLE_PERF_COUNTERS is defined (non-Release).
#perf_log_csv = "benchmark.csv"

# Enable runtime debug tools (stub sweep, missing function scan).
# Produces logs/missed_functions.txt (~97 MB) and logs/stub_sweep.txt. Off by
# default: the US build has never hit a stub, and the scan slows every start.
dev_debug_runtime = false

# Ported from xenia-canary game-patches for Army of Two (4541084C)
# https://github.com/xenia-canary/game-patches/blob/main/patches/4541084C%20-%20Army%20of%20Two%20(Europe).patch.toml
# "Unlock FPS": game speed is tied to FPS, kicks in above ~90FPS.
ao2_fps_unlock = true
# 0=unlimited, 1=60FPS, 2=30FPS. Only applies when ao2_fps_unlock is true.
ao2_fps_unlock_mode = 1
# "Black Shading Fix": disables MSAA.
ao2_disable_msaa = true
ao2_anisotropic_16x = false
